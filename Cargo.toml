[package]
name = "willa-dad-world"
version = "0.0.1-pre.0"
edition = "2024"
rust-version = "1.100.0"

[dependencies]
bevy = { version = "0.20.1", features = ["debug"] }
bevy_voxel_world = { version = "0.19.3", features = ["light_propagation"] }
rand = "0.10.4"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# The release profile is focused on performance and small size
[profile.release]
#opt-level = "z"
lto = true
codegen-units = 1
